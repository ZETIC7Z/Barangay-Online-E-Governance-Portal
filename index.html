  <body class="bg-slate-50 dark:bg-[#0B1120] text-slate-900 dark:text-slate-100 antialiased selection:bg-[#B91C1C] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Prevent pinch-zoom & double-tap zoom on iOS & Android PWA for native app feel
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('dblclick', function (e) {
        e.preventDefault();
      }, { passive: false });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
